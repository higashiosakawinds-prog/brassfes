# Supabase の無料プランは1週間アクセスがないと止まるので、週2回だけ軽くアクセスする。
# config.js に supabaseUrl と supabaseAnonKey が入っていれば動く（空なら何もしない）。
name: keep-supabase-awake

on:
  schedule:
    - cron: "0 0 * * 1,4"   # 毎週 月・木 の朝9時（日本時間）
  workflow_dispatch:         # Actions の画面から手動でも動かせる

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]*' config.js || true)
          KEY=$(grep -oP 'supabaseAnonKey:\s*"\K[^"]*' config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase の設定がまだ空なので、何もしません。"
            exit 0
          fi
          curl -fsS -X POST "$URL/rest/v1/rpc/fes_ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}'
          echo
          echo "Supabase にアクセスしました。"
